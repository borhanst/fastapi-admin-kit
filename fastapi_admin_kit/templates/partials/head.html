    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ get_csrf_token(request) }}">
    <title>{% block title %}Admin{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    {# Tailwind v4 compiled bundle — source: fastapi_admin_kit/static/css/style.css, build: npm run build:css #}
    <link rel="stylesheet" href="/static/css/dist/tailwind.css?v={{ static_version | default('dev') }}">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
    <script defer src="https://unpkg.com/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <script>
      (function() {
        var theme = localStorage.getItem('admin_dark_mode');
        if (theme === 'true') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
